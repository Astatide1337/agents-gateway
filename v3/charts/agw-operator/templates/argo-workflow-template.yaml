{{- if eq .Values.orchestrationBackend "argo" }}
{{- $lifecycleImage := printf "%s@%s" .Values.runtimeImages.lifecycle.repository .Values.runtimeImages.lifecycle.digest -}}
{{- $captureImage := printf "%s@%s" .Values.runtimeImages.capture.repository .Values.runtimeImages.capture.digest -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9./_-]*@sha256:[a-f0-9]{64}$" $lifecycleImage) }}
{{- fail "runtimeImages.lifecycle must be a digest-pinned image when orchestrationBackend=argo" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9./_-]*@sha256:[a-f0-9]{64}$" $captureImage) }}
{{- fail "runtimeImages.capture must be a digest-pinned image when orchestrationBackend=argo" }}
{{- end }}
{{- if eq (len .Values.argo.systemSecretNames) 0 }}
{{- fail "argo.systemSecretNames must explicitly list the system credential Secrets used by Argo prepare" }}
{{- end }}
{{- if eq (len .Values.argo.objectStoreEgressCIDRs) 0 }}
{{- fail "argo.objectStoreEgressCIDRs must explicitly allow the lifecycle object-store destination" }}
{{- end }}
{{- range $cidr := .Values.argo.objectStoreEgressCIDRs }}
{{- if regexMatch "/0+$" $cidr }}
{{- fail "argo.objectStoreEgressCIDRs must not contain an unrestricted /0 CIDR" }}
{{- end }}
{{- end }}
{{- range $name := list .Values.githubApp.existingSecret .Values.objectStore.credentials.existingSecret .Values.artifactSTS.roleARN }}
{{- if not $name }}
{{- fail "githubApp.existingSecret, objectStore.credentials.existingSecret, and artifactSTS.roleARN are required for orchestrationBackend=argo" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.argo.serviceAccountName }}
  namespace: {{ .Values.namespaces.runs }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo-lifecycle
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.argo.serviceAccountName }}
  namespace: {{ .Values.namespaces.runs }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo-lifecycle
rules:
  - apiGroups: ["agents.astatide.com"]
    resources: ["agentruns"]
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.argo.serviceAccountName }}
  namespace: {{ .Values.namespaces.runs }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo-lifecycle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.argo.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.argo.serviceAccountName }}
    namespace: {{ .Values.namespaces.runs }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.argo.waitServiceAccountName }}
  namespace: {{ .Values.namespaces.runs }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo-lifecycle-wait
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.argo.waitServiceAccountName }}
  namespace: {{ .Values.namespaces.runs }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo-lifecycle-wait
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.argo.waitServiceAccountName }}
  namespace: {{ .Values.namespaces.runs }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo-lifecycle-wait
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.argo.waitServiceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.argo.waitServiceAccountName }}
    namespace: {{ .Values.namespaces.runs }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.argo.handoffServiceAccountName }}
  namespace: {{ .Values.namespaces.runs }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo-lifecycle-handoff
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.argo.handoffServiceAccountName }}
  namespace: {{ .Values.namespaces.runs }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: argo-lifecycle-handoff
rules:
  - apiGroups: ["agents.astatide.com"]
    resources: ["agentruns"]
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get"]
  - apiGroups: ["agents.x-k8s.io"]
