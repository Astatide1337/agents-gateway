{{- define "agw-operator.preflightPodSpec" }}
serviceAccountName: {{ include "agw-operator.preflightServiceAccountName" . }}
automountServiceAccountToken: false
enableServiceLinks: false
hostUsers: false
hostNetwork: false
hostPID: false
hostIPC: false
shareProcessNamespace: false
restartPolicy: Never
terminationGracePeriodSeconds: 5
nodeSelector:
  {{- toYaml .Values.preflight.nodeSelector | nindent 2 }}
tolerations:
  - key: {{ .Values.preflight.toleration.key | quote }}
    operator: {{ .Values.preflight.toleration.operator | quote }}
    value: {{ .Values.preflight.toleration.value | quote }}
    effect: {{ .Values.preflight.toleration.effect | quote }}
securityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 1337
  fsGroupChangePolicy: OnRootMismatch
  supplementalGroups:
    - 1337
initContainers:
  - name: lockdown
    image: {{ printf "%s@%s" .Values.runtimeImages.lockdown.repository .Values.runtimeImages.lockdown.digest | quote }}
    imagePullPolicy: IfNotPresent
    command: ["sh", "-ceu"]
    args:
      - |
        iptables-restore --wait --noflush <<'AGW_IPV4'
        *filter
        -P OUTPUT DROP
        -F OUTPUT
        -A OUTPUT -o lo -m owner --uid-owner 1000 -p tcp -d 127.0.0.1 --dport 8081 -j ACCEPT
        -A OUTPUT -m owner --uid-owner 1337 -j ACCEPT
        COMMIT
        AGW_IPV4
        ip6tables-restore --wait --noflush <<'AGW_IPV6'
        *filter
        -P OUTPUT DROP
        -F OUTPUT
        -A OUTPUT -o lo -m owner --uid-owner 1000 -p tcp -d ::1 --dport 8081 -j ACCEPT
        -A OUTPUT -m owner --uid-owner 1337 -j ACCEPT
        COMMIT
        AGW_IPV6
        printf 'ipv4_owner_rule=installed\nipv6_owner_rule=installed\n' > /evidence/lockdown.marker
        chmod 0644 /evidence/lockdown.marker
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
        add: [NET_ADMIN]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
      - name: evidence
        mountPath: /evidence
containers:
  - name: attestor
    image: {{ printf "%s@%s" .Values.runtimeImages.preflight.repository .Values.runtimeImages.preflight.digest | quote }}
    imagePullPolicy: IfNotPresent
    command: ["/agw/preflight"]
    args:
      - "--mode=attest"
      - {{ printf "--namespace=%s" .Values.namespaces.system | quote }}
      - "--configmap-name=agw-preflight"
      - {{ printf "--node-name=%s" .Values.preflight.nodeName | quote }}
      - {{ printf "--node-fingerprint=%s" .Values.preflight.nodeFingerprint | quote }}
      - {{ printf "--runtime-fingerprint=%s" .Values.preflight.runtimeFingerprint | quote }}
      - {{ printf "--api-server-url=%s" .Values.preflight.apiServerURL | quote }}
      - "--deadline=90s"
      - "--agent-wait=30s"
      - "--token-file=/var/run/agw/preflight/token"
      - "--ca-file=/var/run/agw/preflight/ca.crt"
      - "--evidence-dir=/evidence"
      - "--host-proc=/hostproc"
      - "--host-kubelet=/host/kubelet"
      - "--runc-path=/host/runtime/runc"
      - "--containerd-path=/host/runtime/containerd"
      - "--k3s-path=/host/runtime/k3s"
    env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    securityContext:
      runAsUser: 1337
      runAsGroup: 1337
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
      - name: evidence
        mountPath: /evidence
      - name: preflight-api
        mountPath: /var/run/agw/preflight
        readOnly: true
      - name: host-proc
        mountPath: /hostproc
        readOnly: true
      - name: host-kubelet
        mountPath: /host/kubelet
        readOnly: true
      - name: host-runc
        mountPath: /host/runtime/runc
        readOnly: true
      - name: host-containerd
        mountPath: /host/runtime/containerd
        readOnly: true
      - name: host-k3s
        mountPath: /host/runtime/k3s
        readOnly: true
  - name: agent-probe
    image: {{ printf "%s@%s" .Values.runtimeImages.preflight.repository .Values.runtimeImages.preflight.digest | quote }}
    imagePullPolicy: IfNotPresent
    command: ["/agw/preflight"]
    args:
      - "--mode=agent-probe"
      - {{ printf "--api-server-url=%s" .Values.preflight.apiServerURL | quote }}
      - "--deadline=80s"
      - "--agent-wait=30s"
      - "--evidence-dir=/evidence"
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
      - name: evidence
        mountPath: /evidence
volumes:
  - name: evidence
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  - name: preflight-api
    projected:
      defaultMode: 0444
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 600
        - configMap:
            name: kube-root-ca.crt
            items:
              - key: ca.crt
                path: ca.crt
  - name: host-proc
    hostPath:
      path: /proc
      type: Directory
  - name: host-kubelet
    hostPath:
      path: {{ .Values.preflight.hostPaths.kubelet | quote }}
      type: Directory
  - name: host-runc
    hostPath:
      path: {{ .Values.preflight.hostPaths.runc | quote }}
      type: File
  - name: host-containerd
    hostPath:
      path: {{ .Values.preflight.hostPaths.containerd | quote }}
      type: File
  - name: host-k3s
    hostPath:
      path: {{ .Values.preflight.hostPaths.k3s | quote }}
      type: File
{{- end }}

{{- if .Values.preflight.enabled }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agw-preflight
  namespace: {{ .Values.namespaces.system }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: preflight
data: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agw-operator.fullname" . }}-preflight
  namespace: {{ .Values.namespaces.system }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: preflight
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agw-preflight
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: preflight
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: {{ .Values.preflight.apiServerCIDR | quote }}
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "agw-operator.fullname" . }}-preflight
  namespace: {{ .Values.namespaces.system }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: preflight
spec:
  schedule: {{ .Values.preflight.schedule | quote }}
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agw-preflight
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: preflight
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agw-preflight
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: preflight
        spec:
          {{- include "agw-operator.preflightPodSpec" . | nindent 10 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agw-operator.fullname" . }}-preflight-start
  namespace: {{ .Values.namespaces.system }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: preflight
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agw-preflight
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: preflight
    spec:
      {{- include "agw-operator.preflightPodSpec" . | nindent 6 }}
{{- end }}
