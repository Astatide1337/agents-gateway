{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agw-operator.serviceAccountName" . }}
  namespace: {{ .Values.namespaces.system }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- if .Values.preflight.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agw-operator.preflightServiceAccountName" . }}
  namespace: {{ .Values.namespaces.system }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: preflight
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- if .Values.critic.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.critic.gateway.serviceAccountName }}
  namespace: {{ .Values.namespaces.runs }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: critic-gateway-client
# The critic Job projects a bounded, audience-specific token explicitly into
# only its local agentgateway sidecar. It never receives an ambient API token.
automountServiceAccountToken: false
{{- end }}
