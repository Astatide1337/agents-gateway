{{- include "agw-operator.webhookMaterial" . -}}
{{- $material := index .Values "__agw_webhook_material" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.webhook.tlsSecretName }}
  namespace: {{ .Values.namespaces.system }}
  labels:
    {{- include "agw-operator.labels" . | nindent 4 }}
  {{- if .Values.webhook.keepCertificateSecret }}
  annotations:
    helm.sh/resource-policy: keep
    agents.astatide.com/certificate-source: helm-lookup-gen
  {{- end }}
type: kubernetes.io/tls
immutable: true
data:
  ca.crt: {{ $material.caCrt | quote }}
  tls.crt: {{ $material.tlsCrt | quote }}
  tls.key: {{ $material.tlsKey | quote }}
