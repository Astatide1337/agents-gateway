---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: modelroutes.agents.astatide.com
spec:
  group: agents.astatide.com
  names:
    kind: ModelRoute
    listKind: ModelRouteList
    plural: modelroutes
    shortNames:
    - agwmodelroute
    singular: modelroute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelRoute is an ordered, explicitly configured model provider
          route.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelRouteSpec defines ordered model providers.
            properties:
              budget:
                description: ModelBudget bounds provider spend.
                properties:
                  cooldown:
                    pattern: ^$|^[0-9]+(s|m|h)$
                    type: string
                  maxCostUsd:
                    pattern: ^(0|[1-9][0-9]{0,5})([.][0-9]{1,6})?$
                    type: string
                  maxRequests:
                    format: int64
                    maximum: 1000000
                    minimum: 0
                    type: integer
                  maxTokens:
                    format: int64
                    maximum: 1000000000
                    minimum: 0
                    type: integer
                required:
                - maxCostUsd
                type: object
              providers:
                items:
                  description: ModelProvider is one ordered model backend.
                  properties:
                    credentialRef:
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    family:
                      description: |-
                        Family is an explicit provider/model family identifier used for future
                        critic separation. It is intentionally not inferred from Model or Name.
                      maxLength: 64
                      minLength: 1
                      pattern: ^[a-z][a-z0-9-]{0,63}$
                      type: string
                    kind:
                      enum:
                      - openrouter-responses
                      - openai-responses
                      - openrouter-anthropic-messages
                      - anthropic-messages
                      maxLength: 128
                      minLength: 1
                      type: string
                    model:
                      maxLength: 256
                      minLength: 1
                      type: string
                    name:
                      maxLength: 128
                      minLength: 1
                      type: string
                    pricing:
                      description: |-
                        Pricing is optional only for zero-cost routes. When present, the values
                        are micro-USD per token and are copied into the broker's exact pricing
                        table for this provider.
                      properties:
                        inputMicrosPerToken:
                          format: int64
                          maximum: 1000000000000
                          minimum: 0
                          type: integer
                        outputMicrosPerToken:
                          format: int64
                          maximum: 1000000000000
                          minimum: 0
                          type: integer
                      required:
                      - inputMicrosPerToken
                      - outputMicrosPerToken
                      type: object
                    priority:
                      format: int32
                      maximum: 1000
                      minimum: 1
                      type: integer
                  required:
                  - family
                  - kind
                  - model
                  - name
                  - priority
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - budget
            - providers
            type: object
          status:
            description: ResourceStatus is the bounded status shared by configuration
              resources.
            properties:
              conditions:
                items:
                  description: |-
                    Condition is a bounded status condition. Full diagnostics belong in the
                    event stream or report artifact, not in a Kubernetes status object.
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 2048
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      maxLength: 64
                      type: string
                    status:
                      description: |-
                        ConditionStatus is intentionally narrower than a free-form string and is
                        used by every status condition in this package.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              specDigest:
                maxLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
