apiVersion: v1
kind: ServiceAccount
metadata:
  name: agw-phase0-workflow
  namespace: agw-runs
  labels:
    app.kubernetes.io/name: agw-phase0-workflow
    app.kubernetes.io/part-of: agents-gateway-v3
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agw-phase0-workflow
  namespace: agw-runs
  labels:
    app.kubernetes.io/name: agw-phase0-workflow
    app.kubernetes.io/part-of: agents-gateway-v3
rules:
  # Resource-template apply is used instead of create so a replay within the
  # same Workflow UID is convergent. No list permission is needed.
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - create
      - get
      - watch
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - create
      - get
      - watch
      - patch
      - delete
  # Argo's executor records bounded task results for script/resource nodes.
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agw-phase0-workflow
  namespace: agw-runs
  labels:
    app.kubernetes.io/name: agw-phase0-workflow
    app.kubernetes.io/part-of: agents-gateway-v3
subjects:
  - kind: ServiceAccount
    name: agw-phase0-workflow
    namespace: agw-runs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agw-phase0-workflow

# Intentionally absent: Pods, Pods/exec, Pods/log, Secrets, ConfigMaps, Jobs,
# Nodes, namespaces, CRDs, ClusterRoles, and cluster-scoped resources. Argo's
# controller owns Workflow pods; this workflow SA only touches the Sandbox,
# its deterministic workspace PVC, and Argo task-result records.
