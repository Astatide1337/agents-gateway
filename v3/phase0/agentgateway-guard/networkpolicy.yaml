apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agw-phase0-default-deny
  namespace: agw-phase0-guard
  labels:
    app.kubernetes.io/part-of: agents-gateway-v3
    agw.astatide.com/phase: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agw-phase0-guard
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

# The default test is recording-only and uses loopback. No pod-level egress is
# required. An optional public-downstream NetworkPolicy is deliberately not
# included in this kustomization; the airlock and policy must be reviewed as a
# pair before any public egress test is added.
