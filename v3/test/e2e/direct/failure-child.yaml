apiVersion: batch/v1
kind: Job
metadata:
  name: direct-verify-failure
  namespace: __NAMESPACE__
  labels:
    agents.astatide.com/e2e: direct-contract
    agents.astatide.com/role: verify-failure
  ownerReferences:
    - apiVersion: agents.astatide.com/v1alpha1
      kind: AgentRun
      name: __RUN_NAME__
      uid: __RUN_UID__
      controller: true
      blockOwnerDeletion: true
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        agents.astatide.com/e2e: direct-contract
        agents.astatide.com/role: verify-failure
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        agw.astatide.com/agents: "true"
      tolerations:
        - key: agw.astatide.com/agents
          operator: Equal
          value: "true"
          effect: NoSchedule
      restartPolicy: Never
      containers:
        - name: verify
          image: docker.io/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ceu"]
          args:
            - |
              printf '%s\n' '{"code":"VerificationCommandFailed","message":"offline verifier rejected the exact patch","retryable":false,"phase":"Verifying","runUid":"__RUN_UID__","specDigest":"__SPEC_DIGEST__","baseSHA":"__BASE_SHA__"}'
              exit 42
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
