# The Secret values are generated at run time by phase0-credentials.sh and are
# never committed. This manifest mounts each synthetic canary only into the
# container that is supposed to receive it; the agent receives no Secret mount.
apiVersion: v1
kind: Namespace
metadata:
  name: __PHASE0_NAMESPACE__
  labels:
    agw.astatide.com/phase0: "true"
    agw.astatide.com/phase0-run: __PHASE0_RUN_ID__
---
apiVersion: v1
kind: Secret
metadata:
  name: __PHASE0_CANARY_SECRET__
  namespace: __PHASE0_NAMESPACE__
  labels:
    agw.astatide.com/phase0: "true"
    agw.astatide.com/phase0-run: __PHASE0_RUN_ID__
type: Opaque
stringData:
  clone-token: __PHASE0_CLONE_CANARY__
  broker-token: __PHASE0_BROKER_CANARY__
---
apiVersion: v1
kind: Pod
metadata:
  name: __PHASE0_CANARY_POD__
  namespace: __PHASE0_NAMESPACE__
  labels:
    agw.astatide.com/phase0: "true"
    agw.astatide.com/phase0-run: __PHASE0_RUN_ID__
    agw.astatide.com/phase0-check: credential-canary
spec:
  hostUsers: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  shareProcessNamespace: false
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    __PHASE0_NODE_SELECTOR_KEY__: "__PHASE0_NODE_SELECTOR_VALUE__"
  tolerations:
    - key: __PHASE0_TOLERATION_KEY__
      operator: Equal
      value: "__PHASE0_TOLERATION_VALUE__"
      effect: NoSchedule
  initContainers:
    - name: clone-setup
      image: __PHASE0_BASE_IMAGE__
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      env:
        - name: CLONE_TOKEN
          valueFrom:
            secretKeyRef:
              name: __PHASE0_CANARY_SECRET__
              key: clone-token
      command: ["/bin/sh", "-ceu"]
      args:
        - |
          test -n "$CLONE_TOKEN"
          mkdir -p /workspace/.git
          printf '[core]\n\thooksPath = /dev/null\n' > /workspace/.git/config
          printf 'clone_setup_received=true\n'
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  containers:
    - name: agent
      image: __PHASE0_BASE_IMAGE__
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      command: ["/bin/sh", "-ceu"]
      args: ["printf 'agent_ready=true uid=%s\\n' \"$(id -u)\"; sleep 3600"]
      volumeMounts:
        - name: workspace
          mountPath: /workspace
    - name: broker
      image: __PHASE0_BASE_IMAGE__
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 1337
        runAsGroup: 1337
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      env:
        - name: BROKER_TOKEN
          valueFrom:
            secretKeyRef:
              name: __PHASE0_CANARY_SECRET__
              key: broker-token
      command: ["/bin/sh", "-ceu"]
      args: ["test -n \"$BROKER_TOKEN\"; printf 'broker_ready=true uid=%s\\n' \"$(id -u)\"; sleep 3600"]
  volumes:
    - name: workspace
      emptyDir: {}
